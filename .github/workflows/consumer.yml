name: Consumer
on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
permissions:
  contents: read
jobs:
  consume:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout producer head at base repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Record checked-out version
        run: jq -r .version package.json
      - name: Record event shape
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          printf 'producer_event=%s\nhead_sha=%s\nhead_branch=%s\nhead_repo=%s\n' "$EVENT_NAME" "$HEAD_SHA" "$HEAD_BRANCH" "$HEAD_REPO"
